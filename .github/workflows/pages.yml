name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/caser-demo-copy-7ip7vn, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build CS2 dataset (names + CDN image URLs)
        run: node tools/fetch-cs2.mjs

      - name: Stage site into a fresh working tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'tools' \
            --exclude 'node_modules' \
            --exclude '.gitignore' \
            ./ /tmp/site/

      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/site
          touch .nojekyll
          git init -b gh-pages -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            gh-pages:gh-pages
