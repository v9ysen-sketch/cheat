<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="at-title">
<title id="at-title">Army Travel</title>
<style>
.at-pop{animation:at-pop .8s cubic-bezier(.2,.9,.3,1.25) both}
.at-rim{animation:at-draw 1s .1s cubic-bezier(.6,0,.2,1) backwards}
.at-far{animation:at-up .9s .35s cubic-bezier(.2,.8,.2,1) both}
.at-nearr{animation:at-up .9s .55s cubic-bezier(.2,.8,.2,1) both}
.at-sun{animation:at-up 1.4s .5s cubic-bezier(.2,.8,.2,1) both}
.at-mist{animation:at-fade 1s 1.2s both,at-mist 9s 1.2s ease-in-out infinite alternate}
.at-orbit{animation:at-fade .8s 1.1s both}
.at-ring{animation:at-dash 2.4s linear infinite}
.at-l{animation:at-rise .6s cubic-bezier(.2,.9,.25,1.2) both}
.at-sub{animation:at-fade .6s 1.00s both}
.at-mat,.at-rollx{animation-duration:1.1s;animation-delay:1.15s;animation-timing-function:cubic-bezier(.45,0,.2,1);animation-fill-mode:both}
.at-mat{animation-name:at-grow}.at-rollx{animation-name:at-rollx}
.at-rolls{animation:at-rolls 1.1s 1.15s cubic-bezier(.45,0,.2,1) both}
.at-rollr{animation:at-rollr 1.1s 1.15s cubic-bezier(.45,0,.2,1) both}
.at-sheen{opacity:0;animation:at-sheen 6s 2.60s ease-in-out infinite}
.at-static{display:none}
@keyframes at-pop{from{opacity:0;transform:scale(.55)}}
@keyframes at-draw{from{stroke-dasharray:0 100}to{stroke-dasharray:100 0}}
@keyframes at-up{from{transform:translateY(64px)}}
@keyframes at-mist{from{transform:translateX(-9px)}to{transform:translateX(9px)}}
@keyframes at-fade{from{opacity:0}}
@keyframes at-dash{to{stroke-dashoffset:-12}}
@keyframes at-rise{from{opacity:0;transform:translateY(20px)}}
@keyframes at-grow{from{transform:scaleX(0)}}
@keyframes at-rollx{from{opacity:0;transform:translateX(calc(-1*var(--at-len)))}8%{opacity:1}}
@keyframes at-rolls{from{transform:scale(1.7)}}
@keyframes at-rollr{from{transform:rotate(-900deg)}}
@keyframes at-sheen{0%{opacity:0.34;transform:translateX(0)}24%{opacity:0.34;transform:translateX(var(--at-run))}25%,100%{opacity:0;transform:translateX(var(--at-run))}}
@media (prefers-reduced-motion:reduce){
.at-pop,.at-rim,.at-far,.at-nearr,.at-sun,.at-mist,.at-orbit,.at-ring,.at-l,.at-sub,.at-mat,.at-rollx,.at-rolls,.at-rollr,.at-sheen{animation:none}
.at-motion{display:none}.at-static{display:inline}
}
</style>
<defs>
<linearGradient id="at-sky" x1="0" y1="-52" x2="0" y2="30" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8ea05c"/><stop offset="1" stop-color="#56683a"/></linearGradient>
<clipPath id="at-clip"><path d="M0-52 40-40V4C40 28 22 44 0 54-22 44-40 28-40 4V-40Z"/></clipPath>
<clipPath id="at-near"><rect x="-100" y="0" width="200" height="60"/></clipPath>
</defs>
<g transform="translate(80 80)">
<g class="at-orbit"><g transform="rotate(-18)"><g><path class="at-ring" d="M-64 0A64 21 0 1 0 64 0A64 21 0 1 0 -64 0" fill="none" stroke="#3e4b2b" stroke-opacity=".34" stroke-width="1.1" stroke-dasharray="2 4"/><g class="at-motion"><g><animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M-64 0A64 21 0 1 0 64 0A64 21 0 1 0 -64 0"/><path d="M7.5 0 5.6 1.5 3.6 2.2C4.6 6 4.4 10.5 3.4 13.6L3.2 17 2 14.2.6 17.2 0 14.2-2 16.6-2 13.6-4.4 15.2-3.6 12C-4.4 8-4.2 4.5-3.4 2L-5 1.6-10 3.6-10.9 0-10-3.6-5-1.6-3.4-2C-4.2-4.5-4.4-8-3.6-12L-4.4-15.2-2-13.6-2-16.6 0-14.2.6-17.2 2-14.2 3.2-17 3.4-13.6C4.4-10.5 4.6-6 3.6-2.2L5.6-1.5Z" transform="scale(1.2)" fill="#27321a" stroke="#ece7d3" stroke-width=".9" stroke-linejoin="round" paint-order="stroke"/></g></g><g class="at-static" transform="translate(33.9 17.8) rotate(348.4)"><path d="M7.5 0 5.6 1.5 3.6 2.2C4.6 6 4.4 10.5 3.4 13.6L3.2 17 2 14.2.6 17.2 0 14.2-2 16.6-2 13.6-4.4 15.2-3.6 12C-4.4 8-4.2 4.5-3.4 2L-5 1.6-10 3.6-10.9 0-10-3.6-5-1.6-3.4-2C-4.2-4.5-4.4-8-3.6-12L-4.4-15.2-2-13.6-2-16.6 0-14.2.6-17.2 2-14.2 3.2-17 3.4-13.6C4.4-10.5 4.6-6 3.6-2.2L5.6-1.5Z" transform="scale(1.2)" fill="#27321a" stroke="#ece7d3" stroke-width=".9" stroke-linejoin="round" paint-order="stroke"/></g></g></g></g>
<g class="at-pop">
<path d="M0-52 40-40V4C40 28 22 44 0 54-22 44-40 28-40 4V-40Z" fill="url(#at-sky)"/>
<g clip-path="url(#at-clip)">
<circle class="at-sun" cx="13" cy="-17" r="11.5" fill="#ece7d3" fill-opacity=".2"/>
<g class="at-far"><path d="M-44 16-26-6-18 4-6-21 6-3 14-11 44 24V60H-44Z" fill="#44542a"/><path d="M-6-21-.4-12.6-3.4-13.8-6-9.6-8.6-13.4-11.4-11.6ZM14-11 18.4-5.9 15.7-6.9 14-4.2 12.1-6.8 10.4-6ZM-26-6-22.5-1.6-24.6-2.4-26.2.3-27.9-2-29.5-1.3Z" fill="#ece7d3" fill-opacity=".8"/></g>
<path class="at-mist" d="M-60 13C-40 9-20 16 0 12S40 9 60 14V19H-60Z" fill="#ece7d3" fill-opacity=".13"/>
<g class="at-nearr"><path d="M-44 34-22 12-14 20 2 3 16 22 26 13 44 32V60H-44Z" fill="#27321a"/><path d="M2 3 7.4 10.4 4.3 9.2 2 13-.5 9.6-3.6 11.4ZM26 13 29.9 17.2 27.6 16.5 26 19.2 24.4 16.8 22.7 17.6Z" fill="#ece7d3"/></g>
</g>
<path d="M0-44.5 33-34.6V4C33 24 18.5 37.5 0 46.2-18.5 37.5-33 24-33 4V-34.6Z" fill="none" stroke="#ece7d3" stroke-opacity=".3" stroke-width="1"/>
<path class="at-rim" d="M-20-46 0-52 40-40V4C40 28 22 44 0 54-22 44-40 28-40 4V-40Z" pathLength="100" fill="none" stroke="#27321a" stroke-width="3.5" stroke-linejoin="round"/>
</g>
<g class="at-orbit"><g transform="rotate(-18)"><g clip-path="url(#at-near)"><path class="at-ring" d="M-64 0A64 21 0 1 0 64 0A64 21 0 1 0 -64 0" fill="none" stroke="#3e4b2b" stroke-opacity=".34" stroke-width="1.1" stroke-dasharray="2 4"/><g class="at-motion"><g><animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M-64 0A64 21 0 1 0 64 0A64 21 0 1 0 -64 0"/><path d="M7.5 0 5.6 1.5 3.6 2.2C4.6 6 4.4 10.5 3.4 13.6L3.2 17 2 14.2.6 17.2 0 14.2-2 16.6-2 13.6-4.4 15.2-3.6 12C-4.4 8-4.2 4.5-3.4 2L-5 1.6-10 3.6-10.9 0-10-3.6-5-1.6-3.4-2C-4.2-4.5-4.4-8-3.6-12L-4.4-15.2-2-13.6-2-16.6 0-14.2.6-17.2 2-14.2 3.2-17 3.4-13.6C4.4-10.5 4.6-6 3.6-2.2L5.6-1.5Z" transform="scale(1.2)" fill="#27321a" stroke="#ece7d3" stroke-width=".9" stroke-linejoin="round" paint-order="stroke"/></g></g><g class="at-static" transform="translate(33.9 17.8) rotate(348.4)"><path d="M7.5 0 5.6 1.5 3.6 2.2C4.6 6 4.4 10.5 3.4 13.6L3.2 17 2 14.2.6 17.2 0 14.2-2 16.6-2 13.6-4.4 15.2-3.6 12C-4.4 8-4.2 4.5-3.4 2L-5 1.6-10 3.6-10.9 0-10-3.6-5-1.6-3.4-2C-4.2-4.5-4.4-8-3.6-12L-4.4-15.2-2-13.6-2-16.6 0-14.2.6-17.2 2-14.2 3.2-17 3.4-13.6C4.4-10.5 4.6-6 3.6-2.2L5.6-1.5Z" transform="scale(1.2)" fill="#27321a" stroke="#ece7d3" stroke-width=".9" stroke-linejoin="round" paint-order="stroke"/></g></g></g></g>
</g>
</svg>
