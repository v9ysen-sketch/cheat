<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 160" role="img" aria-labelledby="at-title">
<title id="at-title">Army Travel — Made in UA</title>
<style>
.at-peak{animation:at-up .9s cubic-bezier(.2,.8,.2,1) both}
.at-eagle{animation:at-glide 1.5s .45s cubic-bezier(.3,.7,.3,1) both}
.at-wing{animation:at-flapin 1.7s .45s linear both,at-hover 3.4s 2.15s ease-in-out infinite}
.at-bob{animation:at-bob 3.4s 2.15s ease-in-out infinite}
.at-l{animation:at-rise .6s cubic-bezier(.2,.9,.25,1.2) both}
.at-line{animation:at-grow .7s 1.70s cubic-bezier(.6,0,.2,1) both}
.at-sub{animation:at-fade .6s 1.55s both}
.at-sheen{opacity:0;animation:at-sheen 6.5s 3.15s ease-in-out infinite}
@keyframes at-up{from{transform:translateY(50px)}}
@keyframes at-glide{0%{opacity:0;transform:translate(-64px,-58px) rotate(-14deg) scale(.8)}18%{opacity:1}78%{transform:translate(2px,3px) rotate(2deg)}100%{transform:none}}
@keyframes at-flapin{0%{transform:rotate(-20deg)}14%{transform:rotate(15deg)}28%{transform:rotate(-20deg)}42%{transform:rotate(15deg)}57%{transform:rotate(-17deg)}73%{transform:rotate(9deg)}88%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
@keyframes at-hover{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(5deg)}}
@keyframes at-bob{0%,100%{transform:none}25%{transform:translateY(1.6px)}75%{transform:translateY(-1.6px)}}
@keyframes at-rise{from{opacity:0;transform:translateY(20px)}}
@keyframes at-grow{from{transform:scaleX(0)}}
@keyframes at-fade{from{opacity:0}}
@keyframes at-sheen{0%{opacity:0;transform:translateX(0)}18%{opacity:0;transform:translateX(var(--at-run))}19%,100%{opacity:0;transform:translateX(var(--at-run))}}
@media (prefers-reduced-motion:reduce){.at-peak,.at-eagle,.at-wing,.at-bob,.at-l,.at-line,.at-sub,.at-sheen{animation:none}}
</style>
