<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 668 140" role="img" aria-labelledby="at-title">
<title id="at-title">Army Travel — Made in UA</title>
<style>
.at-mount{animation:at-up .9s cubic-bezier(.2,.8,.2,1) both}
.at-roll{animation:at-drop .85s .4s cubic-bezier(.3,.6,.4,1) both}
.at-strap{animation:at-wrap .45s cubic-bezier(.2,.9,.3,1.2) both}
.at-spiral{animation:at-draw 1s 1.05s cubic-bezier(.5,0,.2,1) backwards}
.at-eagle{animation:at-glide 1.3s 1.1s cubic-bezier(.2,.8,.3,1) both}
.at-soar{animation:at-soar 5s 2.5s ease-in-out infinite}
.at-l{animation:at-rise .6s cubic-bezier(.2,.9,.25,1.2) both}
.at-line{transform-origin:0 0;animation:at-grow .7s 1.85s cubic-bezier(.6,0,.2,1) both}
.at-sub{animation:at-fade .6s 1.70s both}
.at-sheen{opacity:0;animation:at-sheen 6s 3.30s ease-in-out infinite}
@keyframes at-draw{from{stroke-dasharray:0 102}to{stroke-dasharray:100 2}}
@keyframes at-up{from{transform:translateY(96px)}}
@keyframes at-drop{0%{opacity:0;transform:translateY(-70px)}25%{opacity:1}60%{transform:translateY(0)}78%{transform:translateY(-6px)}100%{transform:none}}
@keyframes at-wrap{from{opacity:0;transform:scaleY(0)}}
@keyframes at-glide{from{opacity:0;transform:translate(46px,10px) rotate(24deg) scale(.6)}40%{opacity:1}}
@keyframes at-soar{0%,100%{transform:none}30%{transform:translate(3px,-2.5px) rotate(7deg)}70%{transform:translate(-2.5px,1.5px) rotate(-6deg)}}
@keyframes at-rise{from{opacity:0;transform:translateY(20px)}}
@keyframes at-grow{from{transform:scaleX(0)}}
@keyframes at-fade{from{opacity:0}}
@keyframes at-sheen{0%{opacity:0.6;transform:translateX(0)}24%{opacity:0.6;transform:translateX(var(--at-run))}25%,100%{opacity:0;transform:translateX(var(--at-run))}}
@media (prefers-reduced-motion:reduce){.at-mount,.at-roll,.at-strap,.at-spiral,.at-eagle,.at-soar,.at-l,.at-line,.at-sub,.at-sheen{animation:none}}
</style>
