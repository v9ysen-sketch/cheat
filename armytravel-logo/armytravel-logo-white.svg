<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 658 160" role="img" aria-labelledby="at-title">
<title id="at-title">Army Travel — Made in UA</title>
<style>
.at-pop{animation:at-pop .8s cubic-bezier(.2,.9,.3,1.25) both}
.at-rim{animation:at-draw 1s .1s cubic-bezier(.6,0,.2,1) backwards}
.at-far{animation:at-up .9s .35s cubic-bezier(.2,.8,.2,1) both}
.at-nearr{animation:at-up .9s .55s cubic-bezier(.2,.8,.2,1) both}
.at-sun{animation:at-up 1.4s .5s cubic-bezier(.2,.8,.2,1) both}
.at-mist{animation:at-fade 1s 1.2s both,at-mist 9s 1.2s ease-in-out infinite alternate}
.at-orbit{animation:at-fade .8s 1.1s both}
.at-ring{animation:at-dash 2.4s linear infinite}
.at-l{animation:at-rise .6s cubic-bezier(.2,.9,.25,1.2) both}
.at-sub{animation:at-fade .6s 1.45s both}
.at-mat,.at-rollx{animation-duration:1.1s;animation-delay:1.60s;animation-timing-function:cubic-bezier(.45,0,.2,1);animation-fill-mode:both}
.at-mat{animation-name:at-grow}.at-rollx{animation-name:at-rollx}
.at-rolls{animation:at-rolls 1.1s 1.60s cubic-bezier(.45,0,.2,1) both}
.at-rollr{animation:at-rollr 1.1s 1.60s cubic-bezier(.45,0,.2,1) both}
.at-sheen{opacity:0;animation:at-sheen 6s 3.05s ease-in-out infinite}
.at-static{display:none}
@keyframes at-pop{from{opacity:0;transform:scale(.55)}}
@keyframes at-draw{from{stroke-dasharray:0 100}to{stroke-dasharray:100 0}}
@keyframes at-up{from{transform:translateY(64px)}}
@keyframes at-mist{from{transform:translateX(-9px)}to{transform:translateX(9px)}}
@keyframes at-fade{from{opacity:0}}
@keyframes at-dash{to{stroke-dashoffset:-12}}
@keyframes at-rise{from{opacity:0;transform:translateY(20px)}}
@keyframes at-grow{from{transform:scaleX(0)}}
@keyframes at-rollx{from{opacity:0;transform:translateX(calc(-1*var(--at-len)))}8%{opacity:1}}
@keyframes at-rolls{from{transform:scale(1.7)}}
@keyframes at-rollr{from{transform:rotate(-900deg)}}
@keyframes at-sheen{0%{opacity:0.6;transform:translateX(0)}24%{opacity:0.6;transform:translateX(var(--at-run))}25%,100%{opacity:0;transform:translateX(var(--at-run))}}
@media (prefers-reduced-motion:reduce){
.at-pop,.at-rim,.at-far,.at-nearr,.at-sun,.at-mist,.at-orbit,.at-ring,.at-l,.at-sub,.at-mat,.at-rollx,.at-rolls,.at-rollr,.at-sheen{animation:none}
.at-motion{display:none}.at-static{display:inline}
}
</style>
