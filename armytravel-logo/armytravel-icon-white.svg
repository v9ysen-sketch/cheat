<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -30 176 176" role="img" aria-labelledby="at-title">
<title id="at-title">Army Travel</title>
<style>
.at-mat{animation:at-draw 1.5s .1s cubic-bezier(.5,0,.2,1) backwards}
.at-rib{animation-delay:.22s}
.at-eagle{animation:at-glide 1.3s 1.05s cubic-bezier(.2,.8,.3,1) both}
.at-soar{animation:at-soar 5s 2.4s ease-in-out infinite}
.at-l{animation:at-rise .6s cubic-bezier(.2,.9,.25,1.2) both}
.at-line{transform-origin:0 0;animation:at-grow .7s 1.15s cubic-bezier(.6,0,.2,1) both}
.at-sub{animation:at-fade .6s 1.00s both}
.at-sheen{opacity:0;animation:at-sheen 6s 2.60s ease-in-out infinite}
@keyframes at-draw{from{stroke-dasharray:0 102}to{stroke-dasharray:100 2}}
@keyframes at-glide{from{opacity:0;transform:translate(-46px,14px) rotate(-24deg) scale(.6)}40%{opacity:1}}
@keyframes at-soar{0%,100%{transform:none}30%{transform:translate(3px,-2.5px) rotate(7deg)}70%{transform:translate(-2.5px,1.5px) rotate(-6deg)}}
@keyframes at-rise{from{opacity:0;transform:translateY(20px)}}
@keyframes at-grow{from{transform:scaleX(0)}}
@keyframes at-fade{from{opacity:0}}
@keyframes at-sheen{0%{opacity:0.6;transform:translateX(0)}24%{opacity:0.6;transform:translateX(var(--at-run))}25%,100%{opacity:0;transform:translateX(var(--at-run))}}
@media (prefers-reduced-motion:reduce){.at-mat,.at-eagle,.at-soar,.at-l,.at-line,.at-sub,.at-sheen{animation:none}}
</style>
