<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 658 160" role="img" aria-labelledby="at-title">
<title id="at-title">ArmyTravel</title>
<style>
.at-pop{animation:at-pop .8s cubic-bezier(.2,.9,.3,1.25) both}
.at-rim{stroke-dasharray:100;animation:at-draw 1s .1s cubic-bezier(.6,0,.2,1) both}
.at-chev{animation:at-rise .55s cubic-bezier(.2,.9,.3,1.3) both}
.at-chev.c1{animation-delay:.5s}.at-chev.c2{animation-delay:.64s}
.at-star{animation:at-star .7s .85s cubic-bezier(.2,.9,.3,1.4) both}
.at-sweep{animation:at-spin 3.6s linear infinite}
.at-orbit{animation:at-fade .7s 1s both}
.at-ring{animation:at-dash 2.4s linear infinite}
.at-l{animation:at-rise .6s cubic-bezier(.2,.9,.25,1.2) both}
.at-line{transform-origin:0 0;animation:at-grow .7s 1.50s cubic-bezier(.6,0,.2,1) both}
.at-sub{animation:at-fade .6s 1.75s both}
.at-sheen{opacity:0;animation:at-sheen 5.5s 2.05s ease-in-out infinite}
.at-static{display:none}
@keyframes at-pop{from{opacity:0;transform:scale(.55)}}
@keyframes at-draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes at-rise{from{opacity:0;transform:translateY(20px)}}
@keyframes at-star{from{opacity:0;transform:scale(0) rotate(-144deg)}}
@keyframes at-spin{to{transform:rotate(360deg)}}
@keyframes at-fade{from{opacity:0}}
@keyframes at-dash{to{stroke-dashoffset:-12}}
@keyframes at-grow{from{transform:scaleX(0)}}
@keyframes at-sheen{0%{opacity:.75;transform:translateX(0)}26%{opacity:.75;transform:translateX(var(--at-run))}27%,100%{opacity:0;transform:translateX(var(--at-run))}}
@media (prefers-reduced-motion:reduce){
.at-pop,.at-rim,.at-chev,.at-star,.at-sweep,.at-orbit,.at-ring,.at-l,.at-line,.at-sub,.at-sheen{animation:none}
.at-motion{display:none}.at-static{display:inline}
}
</style>
